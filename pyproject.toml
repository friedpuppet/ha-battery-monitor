[project]
name = "ha-battery-monitor"
version = "0.1.0"
description = "Home Assistant integration: battery state, sessions, time left and time to full"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
